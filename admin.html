<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대한민국명장 지도 | 통합 관리자</title>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif;color:#17243a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#082b76;color:#fff;padding:22px clamp(18px,3vw,48px);display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{font-size:22px;margin:0}header p{margin:6px 0 0;color:#c9d8ff;font-size:13px}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700;background:#e9efff;color:#10337a}.btn.primary{background:#1247bf;color:#fff}.btn:focus-visible,.nav:focus-visible{outline:3px solid #efae36}main{max-width:1500px;margin:0 auto;padding:24px}.login{max-width:430px;margin:60px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 30px #162b4b13}.login h2{margin-top:0}.login input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;margin:8px 0;font:inherit}.login button{width:100%;margin-top:10px}.error{color:#bb2735;font-size:13px;min-height:20px}.hidden{display:none!important}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.topline h2{margin:0;font-size:20px}.topline p{margin:6px 0 0;color:#64748b;font-size:13px}.menu{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}.nav{text-align:left;background:#fff;border:1px solid #dbe3ef;border-radius:13px;padding:17px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;min-height:120px;color:inherit}.nav:hover{border-color:#7494d7}.nav.active{border:2px solid #1648b3;background:#eff5ff;padding:16px}.symbol{background:#eaf0ff;color:#1748b5;border-radius:10px;padding:9px;min-width:40px;text-align:center;font-size:21px}.nav strong{display:block;font-size:16px;margin-bottom:7px}.nav small{color:#607086;font-size:12px;line-height:1.5}.viewbar{background:#fff;border:1px solid #dce4ee;border-bottom:0;border-radius:12px 12px 0 0;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px}.viewbar strong{font-size:14px}.frame{display:block;width:100%;height:calc(100vh - 345px);min-height:610px;border:1px solid #dce4ee;border-radius:0 0 12px 12px;background:#fff}#emailLabel{font-size:12px;color:#dce8ff}footer{color:#66758d;font-size:12px;margin-top:15px}@media(max-width:1100px){.menu{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.menu{grid-template-columns:1fr}.nav{min-height:0}.frame{height:75vh;min-height:520px}main{padding:14px}header h1{font-size:18px}}
</style>
</head>
<body>
<header><div><h1>대한민국명장 지도 · 통합 관리자</h1><p>사업장 · 이용통계 · 명장 대상 조사 · 대국민 이용자 설문 통합 관리</p></div><div><span id="emailLabel"></span> <button id="logout" class="btn hidden">로그아웃</button></div></header>
<main>
<section id="loginPanel" class="login"><h2>관리자 로그인</h2><p style="color:#65748b;font-size:13px">기존 Supabase 관리자 계정으로 로그인하세요.</p><form id="loginForm"><input id="email" type="email" autocomplete="username" placeholder="관리자 이메일" required><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" required><button class="btn primary" type="submit">로그인</button></form><p id="loginError" class="error" role="alert"></p></section>
<section id="portal" class="hidden">
<div class="topline"><div><h2>관리 업무</h2><p>원하는 메뉴를 선택하면 아래 영역에서 기존 관리자 화면이 그대로 열립니다.</p></div><button id="openNew" class="btn">현재 화면 새 탭에서 열기 ↗</button></div>
<nav class="menu" aria-label="관리자 기능">
<button class="nav active" data-page="admin-business.html" data-title="사업장 관리"><span class="symbol">▦</span><span><strong>사업장 관리</strong><small>사업장 등록·수정, 공개 여부, 운영상태 및 대표메뉴 관리</small></span></button>
<button class="nav" data-page="admin-stats.html" data-title="이용통계 관리"><span class="symbol">▥</span><span><strong>이용통계 관리</strong><small>방문·검색·사업장 클릭·지역/직종 필터 등 이용현황 분석</small></span></button>
<button class="nav" data-page="meister_effect_admin.html" data-title="명장 대상 설문조사 관리"><span class="symbol">☷</span><span><strong>명장 대상 설문조사 관리</strong><small>명장별 응답, 사업장 정보 확인·수정 요청 및 효과성 조사 관리</small></span></button>
<button class="nav" data-page="admin-user-survey.html" data-title="이용자 설문 분석"><span class="symbol">✓</span><span><strong>이용자 설문 분석</strong><small>대국민 설문 긍정응답률, 평균점수, 유용 기능 및 자유의견 분석</small></span></button>
</nav>
<div class="viewbar"><strong id="currentTitle">사업장 관리</strong><span style="color:#64748b;font-size:12px">기존 관리자 페이지는 그대로 유지</span></div>
<iframe id="workframe" class="frame" title="사업장 관리" referrerpolicy="same-origin"></iframe>
<footer>※ 각 관리 화면의 데이터 접근권한은 기존 Supabase RLS 정책을 따릅니다.</footer>
</section>
</main>
<script>
'use strict';
const cfg=window.MEISTER_SUPABASE_CONFIG||{};
const $=id=>document.getElementById(id);
let client;let selected='admin-business.html';
function selectPage(btn){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===btn));selected=btn.dataset.page;$('currentTitle').textContent=btn.dataset.title;$('workframe').title=btn.dataset.title;$('workframe').src=selected;}
function updateUI(session){const logged=!!session;$('loginPanel').classList.toggle('hidden',logged);$('portal').classList.toggle('hidden',!logged);$('logout').classList.toggle('hidden',!logged);$('emailLabel').textContent=session?.user?.email||'';if(logged&&!$('workframe').getAttribute('src'))selectPage(document.querySelector('.nav.active'));if(!logged)$('workframe').removeAttribute('src')}
try{if(!window.supabase)throw Error('로그인 라이브러리를 불러오지 못했습니다.');if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw Error('supabase-config.js 연결정보를 확인해주세요.');client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});client.auth.getSession().then(({data,error})=>{if(error)throw error;updateUI(data.session)}).catch(e=>$('loginError').textContent=e.message);client.auth.onAuthStateChange((_event,session)=>updateUI(session));}catch(e){$('loginError').textContent=e.message}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='로그인 중...';const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginError').textContent=error?('로그인 실패: '+error.message):'';if(!error)updateUI(data.session)};
$('logout').onclick=async()=>{await client.auth.signOut();updateUI(null)};
document.querySelectorAll('.nav').forEach(btn=>btn.onclick=()=>selectPage(btn));
$('openNew').onclick=()=>window.open(selected,'_blank','noopener,noreferrer');
</script>
</body>
</html>
