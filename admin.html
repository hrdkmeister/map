{font-size:14px}.frame{display:block;width:100%;height:calc(100vh - 330px);min-height:610px;border:1px solid #dce4ee;border-radius:0 0 12px 12px;background:white}#emailLabel{font-size:12px;color:#dce8ff}a{color:#1648b3}footer{color:#66758d;font-size:12px;margin-top:15px}@media(max-width:850px){.menu{grid-template-columns:1fr}.nav{min-height:0}.frame{height:75vh;min-height:520px}main{padding:14px}header h1{font-size:18px}}
</style></head><body><header><div><h1>대한민국명장 지도 · 통합 관리자</h1><p>사업장 관리 · 이용통계 · 효과성 조사 통합 접근</p></div><div><span id="emailLabel"></span> <button id="logout" class="btn hidden">로그아웃</button></div></header>
<main><section id="loginPanel" class="login"><h2>관리자 로그인</h2><p style="color:#65748b;font-size:13px">기존 Supabase 관리자 계정으로 로그인하세요.</p><form id="loginForm"><input id="email" type="email" autocomplete="username" placeholder="관리자 이메일" required><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" required><button class="btn primary" type="submit">로그인</button></form><p id="loginError" class="error" role="alert"></p></section>
<section id="portal" class="hidden"><div class="topline"><div><h2>관리 업무</h2><p>메뉴를 선택하면 아래 영역에서 해당 관리자 화면이 열립니다.</p></div><button id="openNew" class="btn">현재 화면 새 탭에서 열기 ↗</button></div><nav class="menu" aria-label="관리자 기능"><button class="nav active" data-page="admin-business.html" data-title="사업장 관리"><span class="symbol">▦</span><span><strong>사업장 관리</strong><small>등록·수정·공개 상태 및 데이터 백업</small></span></button><button class="nav" data-page="admin-stats.html" data-title="이용통계"><span class="symbol">▥</span><span><strong>이용통계</strong><small>방문·검색 현황, 기간별 통계와 분석</small></span></button><button class="nav" data-page="meister_effect_admin.html" data-title="효과성 조사 관리"><span class="symbol">☷</span><span><strong>효과성 조사 관리</strong><small>명장별 응답, 대표메뉴 변경 요청, CSV 다운로드</small></span></button></nav><div class="viewbar"><strong id="currentTitle">사업장 관리</strong><span style="color:#64748b;font-size:12px">기존 관리자 기능 그대로 이용</span></div><iframe id="workframe" class="frame" title="사업장 관리" referrerpolicy="same-origin"></iframe><footer>※ 각 관리 화면은 별도 로그인·접근 제어를 유지합니다. 관리자 홈 로그인만으로 데이터베이스 권한이 새로 부여되지는 않습니다.</footer></section></main>
<script>
'use strict';
const SUPABASE_URL='https://ikouzufqmsgjpungfnbi.supabase.co';
const KEY='sb_publishable_uwmJ6TovhD7fV7lKvIedBA_I8Yf5oH4';
const $=id=>document.getElementById(id);
let client;let selected='admin-business.html';
function selectPage(btn){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===btn));selected=btn.dataset.page;$('currentTitle').textContent=btn.dataset.title;$('workframe').title=btn.dataset.title;$('workframe').src=selected;}
function updateUI(session){const logged=!!session;$('loginPanel').classList.toggle('hidden',logged);$('portal').classList.toggle('hidden',!logged);$('logout').classList.toggle('hidden',!logged);$('emailLabel').textContent=session?.user?.email||'';if(logged&&!$('workframe').getAttribute('src'))selectPage(document.querySelector('.nav.active'));if(!logged)$('workframe').removeAttribute('src')}
try{if(!window.supabase)throw Error('로그인 라이브러리를 불러오지 못했습니다.');client=window.supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});client.auth.getSession().then(({data,error})=>{if(error)throw error;updateUI(data.session)}).catch(e=>$('loginError').textContent=e.message);client.auth.onAuthStateChange((_event,session)=>updateUI(session));}catch(e){$('loginError').textContent=e.message}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='로그인 중...';const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginError').textContent=error?('로그인 실패: '+error.message):'';if(!error)updateUI(data.session)};
$('logout').onclick=async()=>{await client.auth.signOut();updateUI(null)};
document.querySelectorAll('.nav').forEach(btn=>btn.onclick=()=>selectPage(btn));
$('openNew').onclick=()=>window.open(selected,'_blank','noopener,noreferrer');
</script></body></html>
