<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>명장지도 효과성 조사 관리자</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f2f5fb;font:14px/1.6 Arial,'Noto Sans KR',sans-serif;color:#1b2940}header{background:#0437ab;color:white;padding:22px}header div,main{max-width:1250px;margin:auto}main{padding:20px}.card{background:white;border-radius:12px;padding:20px;margin:0 0 16px;box-shadow:0 4px 16px #1d3c6412}input{padding:11px;border:1px solid #ccd6e3;border-radius:7px;margin:4px}button{background:#0437ab;color:white;border:0;padding:11px 16px;border-radius:7px;cursor:pointer;margin:4px}button.secondary{background:#50647d}table{width:100%;border-collapse:collapse;min-width:880px}td,th{border-bottom:1px solid #dce5ee;padding:10px;text-align:left;vertical-align:top}th{background:#f3f6fb}a{color:#0437ab}.scroll{overflow-x:auto}.muted{color:#68788b}.hide{display:none}pre{white-space:pre-wrap;word-break:break-word;font:inherit}</style></head><body><header><div><h1>대한민국명장 지도 효과성 조사 관리자</h1><div>명장별 링크 발급 현황 · 응답 확인 · 수정 요청 검토</div></div></header><main><section id="login" class="card"><h2>관리자 로그인</h2><input id="email" type="email" placeholder="관리자 이메일"><input id="password" type="password" placeholder="비밀번호"><button id="loginBtn">로그인</button><p id="loginMsg"></p></section><div id="dashboard" class="hide"><section class="card"><button id="refresh">새로고침</button><button id="export">응답 CSV 다운로드</button><button id="links">발송용 링크 CSV 다운로드</button><button class="secondary" id="logout">로그아웃</button><p id="summary"></p><p class="muted">발송용 링크에는 개인별 인증 토큰이 포함되어 있습니다. 외부 공개·공유 금지. 응답에서 요청한 변경사항은 원본 사업장 데이터에 자동 반영되지 않습니다.</p></section><section class="card"><h2>명장별 조사 현황</h2><div class="scroll"><table><thead><tr><th>명장</th><th>사업장 수</th><th>응답</th><th>제출일</th><th>응답·수정 요청</th><th>개별 링크</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script>
const SUPABASE_URL='https://ikouzufqmsgjpungfnbi.supabase.co',KEY='sb_publishable_uwmJ6TovhD7fV7lKvIedBA_I8Yf5oH4';const db=supabase.createClient(SUPABASE_URL,KEY);let records=[];
const surveyUrl=token=>new URL('meister_effect_survey.html?token='+encodeURIComponent(token),location.href).href;
const cell=(tr,value)=>{const td=document.createElement('td');td.textContent=value??'';tr.append(td);return td};
function download(filename,rows){const quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const csv='\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n');const a=document.createElement('a'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function load(){const {data,error}=await db.rpc('meister_effect_admin');if(error)throw error;records=data.rows||[];document.getElementById('summary').textContent=`대상 ${records.length}명 / 응답 ${records.filter(r=>r.response).length}명 / 미응답 ${records.filter(r=>!r.response).length}명`;const tbody=document.getElementById('rows');tbody.replaceChildren();records.forEach(r=>{const tr=document.createElement('tr');cell(tr,r.master_name);cell(tr,r.business_count);cell(tr,r.response?'완료':'미응답');cell(tr,r.response?.submitted_at?new Date(r.response.submitted_at).toLocaleString('ko-KR'):'-');const td=cell(tr,'');if(r.response){const details=document.createElement('details'),sum=document.createElement('summary'),pre=document.createElement('pre');sum.textContent='응답 보기';pre.textContent='[효과성 설문]\n'+JSON.stringify(r.response.answers,null,2)+'\n\n[사업장별 정보 확인]\n'+JSON.stringify(r.response.corrections,null,2);details.append(sum,pre);td.append(details)}const link=cell(tr,'');const a=document.createElement('a');a.href=surveyUrl(r.token);a.target='_blank';a.rel='noopener';a.textContent='설문 링크 열기';link.append(a);tbody.append(tr)})}
async function show(){const {data}=await db.auth.getSession();const logged=!!data.session;document.getElementById('login').className=logged?'hide':'card';document.getElementById('dashboard').className=logged?'':'hide';if(logged){try{await load()}catch(e){document.getElementById('summary').textContent='조회 오류: '+e.message}}}
document.getElementById('loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});document.getElementById('loginMsg').textContent=error?error.message:'';if(!error)show()};document.getElementById('logout').onclick=async()=>{await db.auth.signOut();show()};document.getElementById('refresh').onclick=load;
document.getElementById('links').onclick=()=>download('명장지도_개인별_설문링크.csv',[['명장명','사업장수','응답상태','설문링크'],...records.map(r=>[r.master_name,r.business_count,r.response?'완료':'미응답',surveyUrl(r.token)])]);
document.getElementById('export').onclick=()=>download('명장지도_효과성_설문응답.csv',[['명장명','사업장수','응답상태','제출일','인지도','도움정도','방문변화','개선기능','기타의견','사업장별 수정요청'],...records.map(r=>[r.master_name,r.business_count,r.response?'완료':'미응답',r.response?.submitted_at||'',r.response?.answers?.awareness||'',r.response?.answers?.usefulness||'',r.response?.answers?.impact||'',(r.response?.answers?.features||[]).join('; '),r.response?.answers?.feedback||'',JSON.stringify(r.response?.corrections||{})])]);show();
</script></body></html>
