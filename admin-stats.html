<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>대한민국명장 지도 이용통계</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        "Pretendard",
        "Noto Sans KR",
        Arial,
        sans-serif;
      background: #f4f6f9;
      color: #1f2937;
    }

    .page-header {
      padding: 22px 30px;
      background: #0437ab;
      color: #ffffff;
    }

    .page-header h1 {
      margin: 0;
      font-size: 24px;
    }

    .page-header p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .page-container {
      width: min(1100px, calc(100% - 32px));
      margin: 40px auto;
    }

    .login-card {
      width: min(440px, 100%);
      margin: 70px auto;
      padding: 34px;
      background: #ffffff;
      border: 1px solid #dfe4ea;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .login-card h2 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    .login-description {
      margin: 0 0 26px;
      color: #667085;
      font-size: 14px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .form-group input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #cfd6df;
      border-radius: 8px;
      font-size: 15px;
    }

    .form-group input:focus {
      outline: 2px solid rgba(4, 55, 171, 0.18);
      border-color: #0437ab;
    }

    .login-button,
    .logout-button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .login-button {
      width: 100%;
      height: 48px;
      margin-top: 4px;
      background: #0437ab;
      color: #ffffff;
      font-size: 16px;
    }

    .login-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .error-message {
      min-height: 22px;
      margin-top: 16px;
      color: #c62828;
      font-size: 14px;
      line-height: 1.5;
    }

    .dashboard {
      display: none;
    }

    .dashboard.visible {
      display: block;
    }

    .dashboard-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
      background: #ffffff;
      border: 1px solid #dfe4ea;
      border-radius: 12px;
    }

    .login-user {
      font-size: 14px;
      color: #475467;
    }

    .logout-button {
      padding: 10px 17px;
      background: #e9edf5;
      color: #1f2937;
    }

    .test-card {
      margin-top: 20px;
      padding: 30px;
      background: #ffffff;
      border: 1px solid #dfe4ea;
      border-radius: 12px;
    }

    .test-card h2 {
      margin-top: 0;
    }

    .success-text {
      color: #157347;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .page-header {
        padding: 20px;
      }

      .page-header h1 {
        font-size: 21px;
      }

      .login-card {
        margin-top: 35px;
        padding: 25px 20px;
      }

      .dashboard-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header class="page-header">
    <h1>대한민국명장 지도 이용통계</h1>
    <p>관리자 전용 통계 대시보드</p>
  </header>

  <main class="page-container">

    <!-- 로그인 화면 -->
    <section id="loginSection" class="login-card">
      <h2>관리자 로그인</h2>

      <p class="login-description">
        기존 사업장 설문 관리자 계정으로 로그인해 주세요.
      </p>

      <form id="loginForm">
        <div class="form-group">
          <label for="adminEmail">이메일</label>

          <input
            id="adminEmail"
            type="email"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="adminPassword">비밀번호</label>

          <input
            id="adminPassword"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          id="loginButton"
          class="login-button"
          type="submit"
        >
          로그인
        </button>

        <div
          id="loginError"
          class="error-message"
          aria-live="polite"
        ></div>
      </form>
    </section>

    <!-- 로그인 성공 후 화면 -->
    <section id="dashboardSection" class="dashboard">
      <div class="dashboard-toolbar">
        <div>
          <strong>관리자 로그인 완료</strong>

          <div id="loginUserEmail" class="login-user"></div>
        </div>

        <button
          id="logoutButton"
          class="logout-button"
          type="button"
        >
          로그아웃
        </button>
      </div>

      <div class="test-card">
        <h2>통계 대시보드 연결 준비 완료</h2>

        <p class="success-text">
          기존 관리자 계정 인증이 정상적으로 완료되었습니다.
        </p>

        <p>
          다음 단계에서 이 영역에 날짜별 그래프, 기능별 이용통계,
          사업장별 클릭 순위와 상세 표를 추가합니다.
        </p>
      </div>
    </section>

  </main>

  <script>
    /*
     * 아래 두 값은 기존 index.html에 입력했던 값과 동일하게 넣습니다.
     *
     * supabaseUrl:
     *   https://프로젝트주소.supabase.co
     *
     * supabasePublishableKey:
     *   sb_publishable_로 시작하는 공개키
     */

    const SUPABASE_URL =
      "https://ikouzufqmsgjpungfnbi.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_uwmJ6TovhD7fV7lKvIedBA_I8Yf5oH4";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const loginSection =
      document.getElementById("loginSection");

    const dashboardSection =
      document.getElementById("dashboardSection");

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const loginError =
      document.getElementById("loginError");

    const loginUserEmail =
      document.getElementById("loginUserEmail");

    const logoutButton =
      document.getElementById("logoutButton");

    function showLoginScreen() {
      loginSection.style.display = "block";
      dashboardSection.classList.remove("visible");
      loginUserEmail.textContent = "";
    }

    function showDashboard(user) {
      loginSection.style.display = "none";
      dashboardSection.classList.add("visible");

      loginUserEmail.textContent =
        user && user.email
          ? user.email
          : "관리자 계정";
    }

    async function checkCurrentUser() {
      const {
        data,
        error
      } = await supabaseClient.auth.getUser();

      if (error || !data || !data.user) {
        showLoginScreen();
        return;
      }

      showDashboard(data.user);
    }

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();

      loginError.textContent = "";
      loginButton.disabled = true;
      loginButton.textContent = "로그인 중...";

      const email =
        document.getElementById("adminEmail").value.trim();

      const password =
        document.getElementById("adminPassword").value;

      try {
        const {
          data,
          error
        } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          loginError.textContent =
            "로그인에 실패했습니다. 이메일과 비밀번호를 확인해 주세요.";

          return;
        }

        if (!data || !data.user) {
          loginError.textContent =
            "로그인 정보를 확인하지 못했습니다.";

          return;
        }

        showDashboard(data.user);
      } catch (error) {
        console.error("관리자 로그인 오류:", error);

        loginError.textContent =
          "로그인 처리 중 오류가 발생했습니다.";
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "로그인";
      }
    });

    logoutButton.addEventListener("click", async () => {
      const { error } =
        await supabaseClient.auth.signOut();

      if (error) {
        alert("로그아웃 처리에 실패했습니다.");
        return;
      }

      showLoginScreen();
    });

    supabaseClient.auth.onAuthStateChange(
      (event, session) => {
        if (session && session.user) {
          showDashboard(session.user);
        } else {
          showLoginScreen();
        }
      }
    );

    checkCurrentUser();
  </script>
</body>
</html>
